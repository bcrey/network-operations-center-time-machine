<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Monitor frame -->
  <rect x="20" y="22" width="88" height="60" rx="6" fill="none" stroke="url(#glow)" stroke-width="4"/>
  <!-- Screen scanlines hint -->
  <rect x="26" y="28" width="76" height="48" rx="2" fill="#0f172a"/>
  <rect x="26" y="28" width="76" height="48" rx="2" fill="#38bdf8" opacity="0.08"/>
  <!-- Monitor stand -->
  <rect x="52" y="84" width="24" height="8" rx="2" fill="url(#glow)"/>
  <rect x="44" y="92" width="40" height="4" rx="2" fill="url(#glow)"/>
  <!-- Clock face on screen -->
  <circle cx="64" cy="52" r="18" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
  <!-- Clock hands -->
  <line x1="64" y1="52" x2="64" y2="39" stroke="#f0f9ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="74" y2="52" stroke="#f0f9ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Clock center dot -->
  <circle cx="64" cy="52" r="2.5" fill="#38bdf8"/>
  <!-- Status dots -->
  <circle cx="34" cy="34" r="2.5" fill="#4ade80"/>
  <circle cx="42" cy="34" r="2.5" fill="#facc15"/>
  <circle cx="50" cy="34" r="2.5" fill="#f87171"/>
</svg>
